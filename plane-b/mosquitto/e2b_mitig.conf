# E2b mitigation: mutual TLS plus a per-topic access-control list.
# A client must present a certificate signed by our CA; its common name
# becomes the MQTT username, which the ACL then keys on. A client with no
# certificate cannot complete the TLS handshake, so its bytes never reach
# the MQTT parser. A client with a valid certificate can still only write
# its own topic, which the ACL enforces.
listener 8883 0.0.0.0
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
allow_anonymous false
acl_file mosquitto/acl
persistence false
log_dest stdout
log_type warning
log_type notice
