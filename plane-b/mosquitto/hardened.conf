# Combined (defense-in-depth) broker: the deployable posture.
#
# E2a and E2b each test one control in isolation so their cost and efficacy can
# be measured cleanly. Neither config is what you would actually deploy: the
# E2a listener is plain and anonymous, and the E2b listener has no connection
# cap. A real ward broker combines every control on one TLS listener. This
# config is that combination, and is driven as sub-experiment e2c.
#
#   - mutual TLS (require_certificate)  : bytes from a client with no valid
#                                         certificate never reach the MQTT parser
#   - use_identity_as_username + ACL    : a client may write only its own topic
#   - max_connections                   : the connection table is bounded even
#                                         for a TCP-level flood that never
#                                         completes the TLS handshake
#   - per-source rate limit (nftables)  : applied outside the broker with
#                                         src/ratelimit.sh, as in E2a, because
#                                         Mosquitto has no per-source rate limit
#
# Launch with cwd = plane-b root so the relative paths resolve, and turn the
# rate limit on around the run with: bash src/ratelimit.sh on 8883
listener 8883 0.0.0.0
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
allow_anonymous false
acl_file mosquitto/acl
max_connections 100
persistence false
log_dest stdout
log_type warning
log_type notice
