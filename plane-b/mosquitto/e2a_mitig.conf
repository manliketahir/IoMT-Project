# E2a mitigation: a connection cap on the plain listener.
# The cap sits above the legitimate population (the largest scale is 60
# patients + 1 collector = 61 connections) and well below the volume the
# connection-exhaustion harness opens, so it bounds the connection table
# without denying service to patients. The per-source connection-rate limit
# is the second half of the E2a mitigation and is applied outside the broker
# with src/ratelimit.sh, because Mosquitto has no per-source rate limit of
# its own.
listener 1883 0.0.0.0
max_connections 100
allow_anonymous true
persistence false
log_dest stdout
log_type warning
log_type notice
