# Server-certificate TLS, no client certificate required.
# Used only for the Day 1 TLS-cost comparison against baseline.conf
# (the replication of Seoane et al.: bandwidth and CPU of TLS on MQTT).
listener 8883 0.0.0.0
allow_anonymous true
cafile certs/ca.crt
certfile certs/server.crt
keyfile certs/server.key
require_certificate false
tls_version tlsv1.2
persistence false
log_dest stdout
log_type warning
log_type notice
